[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vyra-preprocessing"
version = "1.0.0"
description = "Person 1 data preparation and image preprocessing for Vyra"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "opencv-python-headless>=4.11,<6",
  "Pillow>=11,<14",
]

[project.optional-dependencies]
data = ["openpyxl>=3.1,<4", "libarchive-c>=5,<6"]
test = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
vyra-preprocess = "vyra_preprocessing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

